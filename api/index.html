<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Agent | Enterprise Evaluation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        
        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Glass & Animations */
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%); border: 1px solid rgba(255,255,255,0.05); }
        
        .message-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(10px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .typing-dot { animation: pulse 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 h-screen flex overflow-hidden selection:bg-indigo-500/30">

    <!-- Sidebar: Candidates -->
    <aside class="w-80 glass border-r border-slate-800 flex flex-col z-20 shrink-0">
        <div class="p-5 border-b border-slate-800/50">
            <div class="flex items-center gap-3 text-indigo-400 mb-1">
                <i data-lucide="cpu" class="w-6 h-6"></i>
                <h1 class="font-bold tracking-tight text-lg text-white">AI Cohort Eval</h1>
            </div>
            <p class="text-xs text-slate-400">Select candidate to deploy agent.</p>
        </div>
        <div class="p-3 flex-1 overflow-y-auto space-y-2" id="candidate-list">
            <!-- Rendered via JS -->
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950">
        
        <!-- Header / Progress Dashboard -->
        <header class="h-[72px] glass border-b border-slate-800 flex items-center px-6 justify-between z-10 sticky top-0">
            <div id="header-profile" class="flex items-center gap-4 opacity-0 transition-opacity duration-300">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20" id="header-avatar"></div>
                <div>
                    <h2 class="text-sm font-semibold text-slate-100" id="header-name"></h2>
                    <p class="text-xs text-slate-400 font-medium" id="header-role"></p>
                </div>
            </div>
            
            <div id="header-metrics" class="flex items-center gap-6 hidden">
                <div class="flex flex-col items-end">
                    <span class="text-xs text-slate-400 mb-1 font-medium">Interview Progress</span>
                    <div class="flex items-center gap-3">
                        <div class="w-32 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-indigo-500 transition-all duration-500 w-0"></div>
                        </div>
                        <span id="turn-counter" class="text-xs font-mono text-indigo-400">0/8</span>
                    </div>
                </div>
                <div id="status-badge" class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-medium flex items-center gap-1.5">
                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></div> Live
                </div>
            </div>
        </header>

        <!-- Chat History -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6" id="chat-container">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-500">
                <div class="w-16 h-16 rounded-2xl bg-slate-800/50 flex items-center justify-center mb-4 border border-slate-700/50">
                    <i data-lucide="user-search" class="w-8 h-8 text-slate-400"></i>
                </div>
                <p class="text-sm font-medium">Awaiting Candidate Selection</p>
            </div>
        </div>

        <!-- Smart Input Area -->
        <div class="p-4 md:p-6 glass border-t border-slate-800">
            <form id="chat-form" class="max-w-4xl mx-auto relative group">
                <textarea 
                    id="message-input" 
                    rows="1"
                    class="w-full bg-slate-900/50 border border-slate-700 text-slate-100 rounded-2xl pl-5 pr-14 py-3.5 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 disabled:opacity-50 resize-none transition-all" 
                    placeholder="Type your technical response... (Press Enter to send)"
                    disabled
                ></textarea>
                <button type="submit" id="send-btn" class="absolute right-2.5 bottom-2.5 p-2 bg-indigo-600 rounded-xl hover:bg-indigo-500 text-white transition-all disabled:opacity-50 disabled:hover:bg-indigo-600 shadow-lg shadow-indigo-500/20" disabled>
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Feedback Analytics Modal -->
    <div id="feedback-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-3xl rounded-2xl p-0 overflow-hidden shadow-2xl shadow-indigo-500/10 transform scale-95 transition-transform duration-300" id="feedback-content">
            
            <!-- Modal Header -->
            <div class="p-6 border-b border-slate-800 flex justify-between items-start bg-slate-900/50">
                <div>
                    <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-semibold mb-3 border border-indigo-500/20">
                        <i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i> Evaluation Complete
                    </div>
                    <h2 class="text-xl font-bold text-white mb-2">Performance Dashboard</h2>
                    <p class="text-slate-400 text-sm leading-relaxed max-w-2xl" id="modal-summary"></p>
                </div>
            </div>
            
            <!-- Modal Body (Grid Layout) -->
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-950/30">
                <div class="space-y-4">
                    <div class="flex items-center gap-2 text-emerald-400 mb-2">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                        <h3 class="font-semibold">Demonstrated Strengths</h3>
                    </div>
                    <ul id="modal-strengths" class="space-y-3"></ul>
                </div>
                
                <div class="space-y-4">
                    <div class="flex items-center gap-2 text-rose-400 mb-2">
                        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                        <h3 class="font-semibold">Technical Gaps</h3>
                    </div>
                    <ul id="modal-gaps" class="space-y-3"></ul>
                </div>
            </div>

            <div class="p-6 border-t border-slate-800 bg-slate-900/50">
                <div class="flex items-center gap-2 text-blue-400 mb-4">
                    <i data-lucide="compass" class="w-5 h-5"></i>
                    <h3 class="font-semibold">Recommended Next Steps</h3>
                </div>
                <ul id="modal-next" class="grid grid-cols-1 md:grid-cols-2 gap-3"></ul>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-800 flex justify-end bg-slate-950">
                <button onclick="UI.hideModal()" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-medium transition-colors">
                    Close Dashboard
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. Data & State Management
        const MOCK_CANDIDATES = [
            {
                "member": { "id": "CAND-001", "name": "Sarah Johnson", "jobRole": "Senior Data Engineer", "yearsExperience": 9 },
                "missions": [{ "day": 7, "title": "Embeddings", "passed": true, "attempts": 1 }, { "day": 12, "title": "Prompting", "passed": true, "attempts": 4 }]
            },
            {
                "member": { "id": "CAND-007", "name": "Ethan Brooks", "jobRole": "Junior Developer", "yearsExperience": 0 },
                "missions": [{ "day": 8, "title": "Vector DBs", "passed": true, "attempts": 1 }, { "day": 22, "title": "Agents", "passed": false, "attempts": 4 }]
            }
        ];

        const state = {
            sessionId: null,
            candidate: null,
            isProcessing: false,
            turnCount: 0,
            maxTurns: 8
        };

        // 2. UI Controller
        const UI = {
            init() {
                lucide.createIcons();
                this.renderSidebar();
                this.setupTextarea();
            },

            renderSidebar() {
                const list = document.getElementById('candidate-list');
                MOCK_CANDIDATES.forEach(cand => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-3 rounded-xl bg-slate-900/50 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 transition-all group flex flex-col gap-0.5";
                    btn.innerHTML = `
                        <span class="font-semibold text-sm text-slate-200 group-hover:text-indigo-400 transition-colors">${cand.member.name}</span>
                        <span class="text-xs text-slate-500">${cand.member.jobRole} • ${cand.member.yearsExperience}y exp</span>
                    `;
                    btn.onclick = () => App.startSession(cand);
                    list.appendChild(btn);
                });
            },

            setupTextarea() {
                const tx = document.getElementById('message-input');
                tx.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
                });
                tx.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        document.getElementById('chat-form').dispatchEvent(new Event('submit'));
                    }
                });
            },

            updateHeader() {
                document.getElementById('header-profile').classList.remove('opacity-0');
                document.getElementById('header-metrics').classList.remove('hidden');
                document.getElementById('header-name').innerText = state.candidate.member.name;
                document.getElementById('header-role').innerText = state.candidate.member.jobRole;
                document.getElementById('header-avatar').innerText = state.candidate.member.name.charAt(0);
                document.getElementById('empty-state')?.remove();
            },

            updateProgress() {
                const percentage = Math.min((state.turnCount / state.maxTurns) * 100, 100);
                document.getElementById('progress-bar').style.width = `${percentage}%`;
                document.getElementById('turn-counter').innerText = `${state.turnCount}/${state.maxTurns}`;
                
                if (state.turnCount >= state.maxTurns) {
                    const badge = document.getElementById('status-badge');
                    badge.innerHTML = '<i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Concluding';
                    badge.className = 'px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs font-medium flex items-center gap-1.5';
                    lucide.createIcons();
                }
            },

            setLoading(isLoading) {
                state.isProcessing = isLoading;
                const input = document.getElementById('message-input');
                const btn = document.getElementById('send-btn');
                
                input.disabled = isLoading;
                btn.disabled = isLoading;
                
                const container = document.getElementById('chat-container');
                if (isLoading) {
                    const div = document.createElement('div');
                    div.id = 'typing-indicator';
                    div.className = 'message-enter flex gap-4 max-w-3xl';
                    div.innerHTML = `
                        <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center shrink-0 mt-1">
                            <i data-lucide="cpu" class="w-4 h-4 text-indigo-400"></i>
                        </div>
                        <div class="bg-slate-800/50 border border-slate-700/50 px-5 py-4 rounded-2xl rounded-tl-sm flex items-center gap-1.5 h-12">
                            <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></div>
                            <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></div>
                            <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></div>
                        </div>
                    `;
                    container.appendChild(div);
                    lucide.createIcons();
                } else {
                    document.getElementById('typing-indicator')?.remove();
                    input.value = '';
                    input.style.height = 'auto';
                    input.focus();
                }
                container.scrollTop = container.scrollHeight;
            },

            appendMessage(role, text) {
                const container = document.getElementById('chat-container');
                const div = document.createElement('div');
                div.className = `message-enter flex gap-4 max-w-3xl ${role === 'user' ? 'ml-auto flex-row-reverse' : ''}`;
                
                if (role === 'ai') {
                    div.innerHTML = `
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shrink-0 mt-1 shadow-md shadow-indigo-500/20">
                            <i data-lucide="cpu" class="w-4 h-4 text-white"></i>
                        </div>
                        <div class="bg-slate-800/80 border border-slate-700 text-slate-200 px-5 py-3.5 rounded-2xl rounded-tl-sm text-sm leading-relaxed shadow-sm">
                            ${text}
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="bg-indigo-600 text-white px-5 py-3.5 rounded-2xl rounded-tr-sm text-sm leading-relaxed shadow-md shadow-indigo-900/50">
                            ${text}
                        </div>
                    `;
                }
                
                container.appendChild(div);
                lucide.createIcons();
                container.scrollTop = container.scrollHeight;
            },

            showModal(feedback) {
                const badge = document.getElementById('status-badge');
                badge.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Completed';
                badge.className = 'px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-medium flex items-center gap-1.5';

                document.getElementById('modal-summary').innerText = feedback.summary;
                
                const buildList = (id, items, iconHtml, stylingClass) => {
                    const ul = document.getElementById(id);
                    ul.innerHTML = items.map(item => `
                        <li class="flex items-start gap-3 text-sm text-slate-300 bg-slate-900/50 p-3 rounded-lg border border-slate-800/50">
                            <div class="${stylingClass} shrink-0 mt-0.5">${iconHtml}</div>
                            <span>${item}</span>
                        </li>
                    `).join('');
                };

                buildList('modal-strengths', feedback.strengths, '<i data-lucide="plus" class="w-4 h-4"></i>', 'text-emerald-400');
                buildList('modal-gaps', feedback.gaps, '<i data-lucide="minus" class="w-4 h-4"></i>', 'text-rose-400');
                buildList('modal-next', feedback.next, '<i data-lucide="arrow-right" class="w-4 h-4"></i>', 'text-blue-400');

                lucide.createIcons();
                
                const modal = document.getElementById('feedback-modal');
                const content = document.getElementById('feedback-content');
                modal.classList.remove('hidden');
                // Trigger reflow for animation
                void modal.offsetWidth;
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            },

            hideModal() {
                const modal = document.getElementById('feedback-modal');
                const content = document.getElementById('feedback-content');
                modal.classList.add('opacity-0');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        };

        // 3. Application Logic
        const App = {
            async startSession(candidateObj) {
                state.candidate = candidateObj;
                state.sessionId = 'req-' + crypto.randomUUID();
                state.turnCount = 0;
                
                document.getElementById('chat-container').innerHTML = '';
                UI.updateHeader();
                UI.updateProgress();
                UI.setLoading(true);

                try {
                    const res = await fetch('/api/interview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId: state.sessionId, candidate: state.candidate })
                    });
                    const data = await res.json();
                    
                    state.turnCount++;
                    UI.updateProgress();
                    UI.appendMessage('ai', data.reply);
                } catch (err) {
                    UI.appendMessage('ai', '⚠️ Connection failed. Please ensure the backend is running.');
                } finally {
                    UI.setLoading(false);
                }
            },

            async sendMessage(text) {
                UI.appendMessage('user', text);
                UI.setLoading(true);

                try {
                    const res = await fetch('/api/interview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId: state.sessionId, message: text })
                    });
                    const data = await res.json();
                    
                    if (!data.done) {
                        state.turnCount++;
                        UI.updateProgress();
                    }
                    
                    UI.appendMessage('ai', data.reply);

                    if (data.done && data.feedback) {
                        setTimeout(() => UI.showModal(data.feedback), 1000); // Slight delay for reading final msg
                    }
                } catch (err) {
                    UI.appendMessage('ai', '⚠️ Failed to send message.');
                } finally {
                    UI.setLoading(false);
                }
            }
        };

        // 4. Event Listeners
        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if(state.isProcessing || !state.sessionId) return;
            const text = document.getElementById('message-input').value.trim();
            if(text) App.sendMessage(text);
        });

        // Init
        document.addEventListener('DOMContentLoaded', () => UI.init());

    </script>
</body>
</html>
